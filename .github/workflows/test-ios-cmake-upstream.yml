name: test upstream ios-cmake
on:
  push:
    branches: [opencv-5.1.0]
    paths: [.github/workflows/test-ios-cmake-upstream.yml]
permissions:
  contents: read
  actions: read
jobs:
  consumers:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['2.4.13.7', '3.4.20', '4.14.0', '5.1.0']
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IOS_DEPLOYMENT_TARGET: '13.0'
      MAC_DEPLOYMENT_TARGET: '11.0'
      MAC_CATALYST_DEPLOYMENT_TARGET: '13.1'
      WATCHOS_DEPLOYMENT_TARGET: '6.0'
      TVOS_DEPLOYMENT_TARGET: '11.0'
      VISIONOS_DEPLOYMENT_TARGET: '1.0'
      OPENCV_VERSION: ${{ matrix.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch unmodified upstream 4.6.1
        run: |
          mkdir -p diagnostics
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leetal/ios-cmake/b36d5bce6f9a2d11d9f144bd5882ba31cfdca420/ios.toolchain.cmake -o diagnostics/upstream.cmake
          echo '8d17b77feb69999ebcf9aa4ce3e07babc3d39f9daa23151b1a4f05b825021f2e  diagnostics/upstream.cmake' | shasum -a 256 -c -
          xcodebuild -version
          clang --version
          cmake --version
      - name: Compare single-configure consumers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          output = root / 'diagnostics'
          version = os.environ['OPENCV_VERSION']
          cases = [
              ('ios-simulator', 'SIMULATOR', 'x86_64;arm64', '13.0', True),
              ('mac-catalyst', 'MAC_CATALYST', 'x86_64;arm64', '13.1', True),
              ('watchos', 'WATCHOS', 'armv7k;arm64_32', '6.0', True),
              ('watchos-simulator', 'SIMULATOR_WATCHOS', 'x86_64;arm64', '6.0', True),
              ('tvos', 'TVOS', 'arm64;arm64e', '11.0', True),
              ('tvos-simulator', 'SIMULATOR_TVOS', 'x86_64;arm64', '11.0', True),
              ('visionos-simulator', 'SIMULATOR_VISIONOS', 'x86_64;arm64', '1.0', True),
              ('macos', 'MAC_UNIVERSAL', 'x86_64;arm64', '11.0', False),
              ('mac-catalyst', 'MAC_CATALYST_UNIVERSAL', 'x86_64;arm64', '13.1', False),
              ('ios-simulator', 'SIMULATOR', 'arm64', '13.0', False),
          ]
          # These are existing build artifacts, not release assets. Libraries are
          # not rebuilt here: only the unchanged repository consumers are built.
          for package in dict.fromkeys(c[0] for c in cases):
              name = f'opencv-mobile-{version}-{package}'
              dest = root / 'packages' / package
              dest.mkdir(parents=True)
              subprocess.run(['gh', 'run', 'download', '42453881116', '--repo', 'nihui/opencv-mobile', '--name', name, '--dir', str(dest)], check=True)
              subprocess.run(['unzip', '-q', str(dest / (name + '.zip')), '-d', str(dest)], check=True)
          results = []
          for variant in ['upstream', 'upstream-xcode', 'current']:
              toolchain = output / 'upstream.cmake' if variant.startswith('upstream') else root / 'toolchains/ios.toolchain.cmake'
              for package, platform, arches, deployment, required in cases:
                  if platform == 'MAC_CATALYST_UNIVERSAL' and variant == 'current':
                      continue
                  name = f'{variant}-{platform}-{arches.replace(";", "_")}'
                  build = root / 'build' / name
                  command = ['cmake', '-S', str(root / 'test'), '-B', str(build), '-G', 'Xcode' if variant == 'upstream-xcode' else 'Unix Makefiles',
                      '-DCMAKE_POLICY_VERSION_MINIMUM=3.5', f'-DCMAKE_TOOLCHAIN_FILE={toolchain}',
                      f'-DPLATFORM={platform}', f'-DARCHS={arches}', f'-DDEPLOYMENT_TARGET={deployment}',
                      '-DENABLE_BITCODE=OFF', '-DENABLE_ARC=OFF', '-DENABLE_VISIBILITY=OFF',
                      '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_INSTALL_PREFIX=install',
                      f'-DOpenCV_DIR={root / "packages" / package}']
                  if package != 'macos':
                      command += ['-DCMAKE_C_FLAGS=-fno-rtti -fno-exceptions', '-DCMAKE_CXX_FLAGS=-fno-rtti -fno-exceptions']
                  row = dict(version=version, variant=variant, platform=platform, arches=arches, required=required)
                  print('::group::' + name, flush=True)
                  with (output / (name + '.log')).open('w') as log:
                      log.write(' '.join(command) + '\n'); log.flush()
                      row['configure'] = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT).returncode
                      row['build'] = None
                      row['lipo'] = None
                      if row['configure'] == 0:
                          row['build'] = subprocess.run(['cmake', '--build', str(build), '--config', 'Release', '-j', '4', '--verbose'], stdout=log, stderr=subprocess.STDOUT).returncode
                      if row['build'] == 0:
                          codes = []
                          for target in ['opencv-mobile-test', 'opencv-mobile-test-imencode']:
                              binaries = [p for p in build.rglob(target) if p.is_file() and '.dSYM' not in str(p) and '.build/' not in str(p)]
                              if len(binaries) != 1:
                                  log.write(f'Unexpected binaries for {target}: {binaries}\n'); codes.append(1); continue
                              subprocess.run(['lipo', '-info', str(binaries[0])], stdout=log, stderr=subprocess.STDOUT)
                              codes.append(subprocess.run(['lipo', str(binaries[0]), '-verify_arch', *arches.split(';')], stdout=log, stderr=subprocess.STDOUT).returncode)
                          row['lipo'] = max(codes)
                  print((output / (name + '.log')).read_text(), flush=True)
                  print('RESULT ' + json.dumps(row), flush=True)
                  print('::endgroup::', flush=True)
                  results.append(row)
          (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## OpenCV {version}, ios-cmake 4.6.1 vs current PR\n\n')
              summary.write('Existing framework artifacts from run 42453881116; consumers compile/link only, no device runtime or library rebuild. Each invocation retains the whole architecture list.\n\n')
              summary.write('| Toolchain | Platform | Architectures | Configure | Build | lipo |\n|---|---|---|---|---|---|\n')
              for row in results:
                  summary.write('| ' + ' | '.join(str(row[k]) for k in ['variant', 'platform', 'arches', 'configure', 'build', 'lipo']) + ' |\n')
          assert all(r['lipo'] == 0 for r in results if r['required']), 'One or more original universal consumers failed; see results.json.'
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-cmake-comparison-${{ matrix.version }}
          path: diagnostics/
